<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mancala</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<script>(function(){ try{ if(localStorage.getItem('nysgpt-theme-f3')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){} })();</script>
<link rel="stylesheet" href="shell.css" />
<style>
  /* Mancala's own stage */
  :root{
    --bg:#c9713c; --panel:#fffaf2; --panel-2:#fbeee2; --ink:#2a1a3e; --ink-dim:#7a6385; --ink-faint:#b6a6c0; --shadow:#8a4418;
    --teal:#1fc7b6; --teal-sh:#13978a; --pink:#ff4d8d; --yellow:#ffd23f; --purple:#8b5cf6; --purple-sh:#6d3fd6;
    --p0:#ff4d8d; --p0-sh:#cc2f6e; --p1:#1fc7b6; --p1-sh:#13978a;
    --font-display:"Luckiest Guy",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif; --pop:1;
    --sh-a:var(--p0); --sh-a-sh:var(--p0-sh); --sh-b:var(--p1); --sh-b-sh:var(--p1-sh);
  }
  :root[data-theme="dark"]{ --bg:#2a160a; --panel:#3d2414; --panel-2:#50301c; --ink:#f6f1ff; --ink-dim:#bcaee3; --ink-faint:#7a6aa8; --shadow:#08051a; }
  :root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:800;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;background-attachment:fixed;
    background-image:radial-gradient(circle at 18% 16%, rgba(255,255,255,.10), transparent 42%),radial-gradient(circle at 84% 82%, rgba(255,255,255,.07), transparent 46%)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .bgfloat{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgfloat .b{position:absolute;border-radius:50%;opacity:.16;background:#fff;animation:bob 7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(6deg)}}
  .stage{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:92px 18px 40px}
  .screen{display:none;width:100%;max-width:520px}
  .screen.on{display:block}
  .card{background:var(--panel);border-radius:28px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);padding:34px 36px;width:100%;animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  @media(max-width:560px){.card{padding:28px 22px}}
  h1{font-family:var(--font-display);font-size:clamp(34px,7vw,50px);text-align:center;line-height:.98;margin-bottom:10px;font-weight:400}
  h1 .x{color:var(--p0)} h1 .o{color:var(--p1);display:inline-block;transform:rotate(-4deg)}
  .sub{text-align:center;color:var(--ink-dim);font-size:15px;margin-bottom:22px;line-height:1.5}
  .rules{background:var(--panel-2);border-radius:18px;padding:18px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:11px}
  .rule{display:flex;align-items:center;gap:13px;font-size:14.5px}
  .rule .n{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:var(--teal);color:#053d38;display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--teal-sh)}
  .rule:nth-child(2) .n{background:var(--pink);box-shadow:0 3px 0 #cc2f6e;color:#fff}
  .rule:nth-child(3) .n{background:var(--yellow);box-shadow:0 3px 0 #d9a800;color:#5a4500}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:#fff;background:var(--p0);
    padding:15px 26px;border-radius:16px;position:relative;top:0;box-shadow:0 calc(6px * var(--pop)) 0 var(--p0-sh);transition:top .08s,box-shadow .08s}
  .btn:active{top:5px;box-shadow:0 1px 0 var(--p0-sh)}

  .play{max-width:720px}
  .score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .score.three{grid-template-columns:1fr auto 1fr}
  .pill{background:var(--panel);border-radius:16px;box-shadow:0 calc(5px * var(--pop)) 0 var(--shadow);padding:10px 12px;text-align:center;transition:transform .15s,box-shadow .15s;min-width:0}
  .pill .k{font-family:var(--font-display);font-size:15px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill .v{font-family:var(--font-display);font-size:30px;line-height:1.1}
  .pill.p0 .k{color:var(--p0)} .pill.p1 .k{color:var(--p1)} .pill.pd .k{color:var(--ink-faint)}
  .pill.turn{transform:scale(1.07);box-shadow:0 5px 0 var(--shadow),0 0 0 4px var(--yellow)}
  .status{font-family:var(--font-display);font-size:24px;text-align:center;color:#fff;text-shadow:0 3px 0 var(--shadow);min-height:34px;margin-bottom:14px}
  .boardcard{background:var(--panel);border-radius:26px;padding:16px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  .mboard{display:grid;grid-template-columns:1fr repeat(6,1fr) 1fr;grid-template-rows:1fr 1fr;gap:10px;background:#a95a2a;border-radius:22px;padding:14px;box-shadow:inset 0 4px 0 rgba(0,0,0,.18)}
  :root[data-theme="dark"] .mboard{background:#5e3317}
  .pit,.store{background:#f3dcc4;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;box-shadow:inset 0 5px 0 rgba(0,0,0,.14);aspect-ratio:1;min-width:0}
  :root[data-theme="dark"] .pit,:root[data-theme="dark"] .store{background:#8a5230}
  .store{grid-row:1/3;aspect-ratio:auto;border-radius:999px}
  .store.mine{grid-column:8} .store.theirs{grid-column:1}
  .pit{grid-row:1} .pit.mine{grid-row:2}
  .pit.mine.can{cursor:pointer;box-shadow:inset 0 5px 0 rgba(0,0,0,.14),0 0 0 3px var(--yellow)}
  .pit.mine.can:hover{filter:brightness(1.06);transform:translateY(-2px)}
  .pit.hot,.store.hot{box-shadow:inset 0 5px 0 rgba(0,0,0,.14),0 0 0 4px #fff}
  .stones{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:78%}
  .stones i{width:9px;height:9px;border-radius:50%;background:var(--c,#5b8def);box-shadow:inset -1px -2px 0 rgba(0,0,0,.2)}
  .cnt{font-family:var(--font-display);font-size:clamp(14px,2.6vw,20px);color:#6b3a17;line-height:1}
  :root[data-theme="dark"] .cnt{color:#fbe6d2}
  .store .cnt{font-size:clamp(22px,4vw,32px)}
  .tag{grid-column:1/-1;text-align:center;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  @media(max-width:560px){.mboard{gap:5px;padding:9px}.stones i{width:6px;height:6px}}
</style>
</head>
<body>
<div class="bgfloat" id="bgfloat"></div>
<div class="stage">
  <section class="screen on" id="scIntro">
    <div class="card">
      <h1><span class="x">Man</span><span class="o">cala</span></h1>
      <div class="sub">Sow your stones, fill your store.<br>Play the computer or a friend.</div>
      <div class="rules">
        <div class="rule"><span class="n">1</span><span>Pick a pit on your side. Its stones drop one by one, counter-clockwise.</span></div>
        <div class="rule"><span class="n">2</span><span>Last stone in your store: go again. In an empty pit of yours: take it and the stones across.</span></div>
        <div class="rule"><span class="n">3</span><span>When one side runs out, the fuller store wins.</span></div>
      </div>
      <button class="btn" id="introGo">Let's play!</button>
    </div>
  </section>

  <section class="screen play" id="scGame">
    <div class="score">
      <div class="pill p1" id="pB"><div class="k" id="kB"></div><div class="v" id="sB">0</div></div>
      <div class="pill p0" id="pA"><div class="k" id="kA"></div><div class="v" id="sA">0</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="boardcard"><div class="mboard" id="mboard"></div></div>
  </section>
</div>

<script src="shell.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Shell.esc;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }
(function bg(){ const w=$('bgfloat'); for (let i=0;i<9;i++){ const b=document.createElement('div'); b.className='b'; const s=40+Math.random()*80;
  Object.assign(b.style,{ width:s+'px', height:s+'px', left:Math.random()*100+'%', top:Math.random()*100+'%', animationDelay:(-Math.random()*7)+'s' }); w.appendChild(b); } })();

//// ===== sounds =====
let AC=null;
function tone(f, dur, type='triangle', vol=.16, delay=0){
  if (!Shell.soundOn()) return;
  try{ AC ||= new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur); }catch(e){}
}
const sndWin = () => [523,659,784,1047].forEach((f,i) => tone(f, i===3 ? .5 : .14, 'triangle', .18, i*.09));
const sndLose = () => [392,330,262].forEach((f,i) => tone(f, .22, 'sine', .15, i*.14));
const sndDraw = () => [392,330].forEach((f,i) => tone(f, .22, 'sine', .15, i*.14));
const plural = (n, w, ws=w+'s') => `${n} ${n===1 ? w : ws}`;

const sndDrop = k => tone(440 + (k%6)*55, .06, 'sine', .1);
const sndCap = () => [659,880].forEach((f,i) => tone(f, .14, 'triangle', .16, i*.07));

//// ===== the game (Kalah): pits 0–5 + store 6 are player 0's; pits 7–12 + store 13 are player 1's =====
const STORE = [6, 13];
const ownPit = (p, j) => p ? j>=7 && j<=12 : j>=0 && j<=5;
function sow(s, p, i){
  s=s.slice(); let n=s[i], j=i; s[i]=0; const path=[];
  while (n>0){ j=(j+1)%14; if (j===STORE[1-p]) continue; s[j]++; n--; path.push(j); }
  const again = j===STORE[p];
  let cap=false;
  if (ownPit(p,j) && s[j]===1 && s[12-j]>0){ s[STORE[p]] += s[12-j]+1; s[j]=0; s[12-j]=0; cap=true; }
  const a=s.slice(0,6).reduce((x,y)=>x+y,0), b=s.slice(7,13).reduce((x,y)=>x+y,0);
  const over = a===0 || b===0;
  if (over){ s[6]+=a; s[13]+=b; for (let k=0;k<14;k++) if (k!==6 && k!==13) s[k]=0; }
  return { s, again, path, cap, over };
}
const legal = (s, p) => [0,1,2,3,4,5].map(k => p ? k+7 : k).filter(k => s[k]>0);

//// ===== the computer: minimax with alpha-beta (Hard) or mostly random (Easy) =====
function search(s, p, cpu, depth, al, be){
  const moves = legal(s, p);
  if (!depth || !moves.length) return { v: s[STORE[cpu]] - s[STORE[1-cpu]] };
  let best = { v: p===cpu ? -1e9 : 1e9, i: moves[0] };
  for (const i of moves){
    const r = sow(s, p, i);
    const v = r.over ? (r.s[STORE[cpu]] - r.s[STORE[1-cpu]])*10 : search(r.s, r.again ? p : 1-p, cpu, depth-1, al, be).v;
    if (p===cpu ? v>best.v : v<best.v) best = { v, i };
    if (p===cpu) al=Math.max(al,v); else be=Math.min(be,v);
    if (be<=al) break;
  }
  return best;
}
function cpuMove(){
  const moves = legal(G.s, 1);
  if (G.level==='easy' && Math.random()<.6) return moves[Math.floor(Math.random()*moves.length)];
  return search(G.s, 1, 1, 7, -1e9, 1e9).i;
}

// mode: 'cpu' (you are player 0) or 'online' (host 0, guest 1)
const G = { mode:'cpu', level:'hard', s:[], turn:0, starter:0, over:false, busy:false, room:null, me:0, hot:-1, q:Promise.resolve() };
const nameOf = p => {
  if (G.mode==='cpu') return p===0 ? 'You' : 'Computer';
  const R=G.room, q = p===G.me ? R.me : R.other;
  return q ? `${q.avatar} ${q.name}` : (p ? 'Player 2' : 'Player 1');
};
const COLORS=['#5b8def','#ff4d8d','#ffd23f','#1fc7b6','#8b5cf6','#ff7a3c'];
function cell(k, cls){
  const n=G.s[k], dots = Array.from({ length:Math.min(n, k===6||k===13 ? 24 : 12) }, (_,i) => `<i style="--c:${COLORS[(k*3+i)%6]}"></i>`).join('');
  return `<div class="${cls}${k===G.hot?' hot':''}" data-k="${k}"><div class="stones">${dots}</div><div class="cnt">${n}</div></div>`;
}
function render(){
  const me=G.me, them=1-me, mine = me ? [7,8,9,10,11,12] : [0,1,2,3,4,5], theirs = them ? [12,11,10,9,8,7] : [5,4,3,2,1,0];
  const can = !G.over && !G.busy && G.turn===me;
  $('mboard').innerHTML =
    cell(STORE[them], 'store theirs') +
    theirs.map(k => cell(k, 'pit')).join('') +
    cell(STORE[me], 'store mine') +
    mine.map(k => cell(k, 'pit mine'+(can && G.s[k]>0 ? ' can':''))).join('');
  $('mboard').querySelectorAll('.pit.mine').forEach(el => el.onclick=()=>humanMove(+el.dataset.k));
  $('kA').textContent=nameOf(me); $('kB').textContent=nameOf(them);
  $('sA').textContent=G.s[STORE[me]]; $('sB').textContent=G.s[STORE[them]];
  $('pA').classList.toggle('turn', !G.over && G.turn===me); $('pB').classList.toggle('turn', !G.over && G.turn===them);
  $('status').innerHTML = G.over ? '' : G.turn===me ? 'Your move' : (G.mode==='cpu' ? 'Thinking…' : `${esc(nameOf(G.turn))}'s move`);
}
// every move animates stone by stone; moves queue so the two screens stay in step
function move(i){
  G.q = G.q.then(() => new Promise(done => {
    if (G.over || G.s[i]===0) return done();
    const p=G.turn, r=sow(G.s, p, i);
    G.busy=true; const s=G.s.slice(); s[i]=0; G.s=s; G.hot=i; render();
    let step=0;
    const tick = () => {
      if (step<r.path.length){ const j=r.path[step++]; G.s[j]++; G.hot=j; sndDrop(step); render(); return setTimeout(tick, 150); }
      G.s=r.s; G.hot=-1; if (r.cap) sndCap();
      if (!r.again) G.turn=1-p;
      G.busy=false;
      if (r.over){ G.over=true; render(); finish(); return done(); }
      render(); done();
      if (G.mode==='cpu' && G.turn===1) setTimeout(() => move(cpuMove()), 500);
    };
    setTimeout(tick, 150);
  }));
}
function humanMove(i){
  if (G.busy || G.over || G.turn!==G.me || !ownPit(G.me,i) || !G.s[i]) return;
  if (G.mode==='online' && G.room) G.room.send({ t:'sow', i });
  move(i);
}
function newGame(){
  Object.assign(G, { s:[4,4,4,4,4,4,0,4,4,4,4,4,4,0], over:false, busy:false, hot:-1, q:Promise.resolve() });
  G.turn=G.starter; G.starter=1-G.starter;
  show('scGame'); render();
  if (G.mode==='cpu' && G.turn===1) setTimeout(() => move(cpuMove()), 600);
}
function finish(){
  const a=G.s[STORE[G.me]], b=G.s[STORE[1-G.me]], w = a===b ? -1 : a>b ? G.me : 1-G.me, won = w===G.me;
  if (w<0) sndDraw(); else if (won) sndWin(); else sndLose();
  if (won) Shell.postScore('mancala', 1);
  setTimeout(() => Shell.results({
    em: w<0 ? '🤝' : won ? '🏆' : (G.mode==='cpu' ? '🤖' : '😬'),
    title: w<0 ? "It's a draw" : won ? 'You win!' : (G.mode==='cpu' ? 'The computer wins' : `${esc(nameOf(w))} wins`),
    sub: `${plural(a,'stone')} to ${b}.`,
    again: { label:'Play again', onClick:()=>{ if (G.mode==='online' && G.room) G.room.send({ t:'again' }); newGame(); } },
    change: { label:'Change mode', onClick:()=>{ leaveRoom(); openMode(); } },
  }), 1100);
}

//// ===== the standard start sequence =====
function openMode(){
  Shell.mode({ options:[
      { label:'Play the computer', onClick:pickLevel },
      { label:'Play a friend', kind:'b', onClick:()=>Shell.friend(FRIEND) } ],
    onBack:()=>show('scIntro') });
}
function pickLevel(){
  Shell.mode({ title:'How tough?', options:[
      { label:'Easy', onClick:()=>startCpu('easy') },
      { label:'Hard', kind:'b', onClick:()=>startCpu('hard') } ],
    onBack:openMode });
}
function startCpu(level){
  Shell.hide(); leaveRoom();
  Object.assign(G, { mode:'cpu', level, me:0, starter:0 }); newGame();
}
const FRIEND = {
  game:'mancala',
  onBack: openMode,
  onStart: R => { Object.assign(G, { mode:'online', room:R, me: R.isHost ? 0 : 1, starter:0 }); newGame(); },
  onMessage: m => {
    if (m.t==='sow'){ if (!G.over && ownPit(1-G.me, m.i)) move(m.i); }
    else if (m.t==='again' && G.over){ Shell.hide(); newGame(); }
  },
  onLeft: () => { if (!G.over) $('status').textContent = 'Your friend left'; },
};
function leaveRoom(){ if (G.room){ Shell.leaveRoom(); G.room=null; } }

$('introGo').onclick = () => Shell.requirePlayer().then(openMode);
Shell.addBack('#scIntro .card', () => Shell.nav('games'));
Shell.init({
  brand:'Mancala',
  theme:{ key:'nysgpt-theme-f3', darkDefault:false },
  beforeLeave:()=>!G.room || confirm('Leave this game?'),
  onJoinLink: code => Shell.joinCode(FRIEND, code),
  playground:{ swatches:['#c9713c','#37c871','#1fc7b6','#8b5cf6','#2d6fd6','#ff4d8d'].map(c=>({ bg:c, vars:{ '--bg':c } })) },
});
</script>
</body>
</html>
