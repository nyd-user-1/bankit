<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<script>(function(){ try{ if(localStorage.getItem('nysgpt-theme-f3')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){} })();</script>
<link rel="stylesheet" href="shell.css" />
<style>
  /* Memory's own stage: sunshine */
  :root{
    --bg:#ffc93d; --panel:#fffaf2; --panel-2:#fff1cc; --ink:#3a2a00; --ink-dim:#7d6630; --ink-faint:#b9a36a; --shadow:#c99200;
    --back:#ff7a3c; --back-sh:#b8501f; --pink:#ff4d8d; --teal:#1fc7b6; --teal-sh:#13978a; --purple:#8b5cf6; --purple-sh:#6d3fd6;
    --font-display:"Luckiest Guy",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif; --pop:1;
    --sh-a:var(--purple); --sh-a-sh:var(--purple-sh); --sh-b:var(--teal); --sh-b-sh:var(--teal-sh);
  }
  :root[data-theme="dark"]{ --bg:#3a2c05; --panel:#4a3a10; --panel-2:#5a481a; --ink:#fff6dc; --ink-dim:#e0cc94; --ink-faint:#a58f55; --shadow:#1b1300; }
  :root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:800;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;background-attachment:fixed;
    background-image:radial-gradient(circle at 18% 16%, rgba(255,255,255,.18), transparent 42%),radial-gradient(circle at 84% 82%, rgba(255,255,255,.1), transparent 46%)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .bgfloat{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgfloat .b{position:absolute;border-radius:18%;opacity:.2;background:#fff;animation:bob 7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-26px) rotate(8deg)}}
  .stage{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:92px 18px 40px}
  .screen{display:none;width:100%;max-width:520px}
  .screen.on{display:block}
  .card{background:var(--panel);border-radius:28px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);padding:34px 36px;width:100%;animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  @media(max-width:560px){.card{padding:28px 22px}}
  h1{font-family:var(--font-display);font-size:clamp(38px,8vw,56px);text-align:center;line-height:.98;margin-bottom:10px;font-weight:400;color:var(--back)}
  h1 span{display:inline-block;transform:rotate(-4deg);color:var(--purple)}
  .sub{text-align:center;color:var(--ink-dim);font-size:15px;margin-bottom:22px;line-height:1.5}
  .rules{background:var(--panel-2);border-radius:18px;padding:18px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:11px}
  .rule{display:flex;align-items:center;gap:13px;font-size:14.5px}
  .rule .n{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:var(--teal);color:#053d38;display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--teal-sh)}
  .rule:nth-child(2) .n{background:var(--pink);box-shadow:0 3px 0 #cc2f6e;color:#fff}
  .rule:nth-child(3) .n{background:var(--purple);box-shadow:0 3px 0 var(--purple-sh);color:#fff}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:#fff;background:var(--purple);
    padding:15px 26px;border-radius:16px;position:relative;top:0;box-shadow:0 calc(6px * var(--pop)) 0 var(--purple-sh);transition:top .08s,box-shadow .08s}
  .btn:active{top:5px;box-shadow:0 1px 0 var(--purple-sh)}

  .play{max-width:min(440px, calc((100dvh - 290px) * .75 * 4 / 4.35 + 36px))}
  .score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .pill{background:var(--panel);border-radius:16px;box-shadow:0 calc(5px * var(--pop)) 0 var(--shadow);padding:10px 8px;text-align:center;transition:transform .15s,box-shadow .15s;min-width:0}
  .pill .k{font-family:var(--font-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-dim)}
  .pill .v{font-family:var(--font-display);font-size:30px;line-height:1.1}
  .pill.turn{transform:scale(1.07);box-shadow:0 5px 0 var(--shadow),0 0 0 4px var(--purple)}
  .status{font-family:var(--font-display);font-size:24px;text-align:center;color:var(--ink);min-height:34px;margin-bottom:14px}
  .deck{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  .mc{aspect-ratio:3/4;perspective:700px;cursor:pointer}
  .mc .in{position:relative;width:100%;height:100%;transition:transform .42s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
  .mc.up .in,.mc.done .in{transform:rotateY(180deg)}
  .mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center}
  .mc .b{background:var(--back);box-shadow:0 calc(6px * var(--pop)) 0 var(--back-sh);
    background-image:radial-gradient(rgba(255,255,255,.35) 2px, transparent 2.5px);background-size:16px 16px}
  .mc .b::after{content:"?";font-family:var(--font-display);font-size:34px;color:#fff;text-shadow:0 3px 0 var(--back-sh)}
  .mc .f{background:var(--panel);transform:rotateY(180deg);box-shadow:0 calc(6px * var(--pop)) 0 var(--shadow);font-size:clamp(34px,9vw,52px)}
  .mc.done .f{box-shadow:0 calc(6px * var(--pop)) 0 var(--shadow),inset 0 0 0 4px var(--teal)}
  .mc.done{cursor:default}
  .mc.done .f span{animation:yay .5s ease}
  @keyframes yay{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  .mc:not(.up):not(.done):hover .in{transform:translateY(-3px)}
</style>
</head>
<body>
<div class="bgfloat" id="bgfloat"></div>
<div class="stage">
  <section class="screen on" id="scIntro">
    <div class="card">
      <h1>Memory <span>Match</span></h1>
      <div class="sub">Sixteen cards, eight pairs.<br>Play solo or race a friend.</div>
      <div class="rules">
        <div class="rule"><span class="n">1</span><span>Flip two cards.</span></div>
        <div class="rule"><span class="n">2</span><span>A match stays up — and with a friend, you go again.</span></div>
        <div class="rule"><span class="n">3</span><span>Solo: fewer tries, more points. With a friend: most pairs wins.</span></div>
      </div>
      <button class="btn" id="introGo">Let's play!</button>
    </div>
  </section>

  <section class="screen play" id="scGame">
    <div class="score">
      <div class="pill" id="pA"><div class="k" id="kA">You</div><div class="v" id="sA">0</div></div>
      <div class="pill" id="pB"><div class="k" id="kB">Tries</div><div class="v" id="sB">0</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="deck" id="deck"></div>
  </section>
</div>

<script src="shell.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Shell.esc;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }
(function bg(){ const w=$('bgfloat'); for (let i=0;i<10;i++){ const b=document.createElement('div'); b.className='b'; const s=24+Math.random()*56;
  Object.assign(b.style,{ width:s+'px', height:s*1.3+'px', left:Math.random()*100+'%', top:Math.random()*100+'%', animationDelay:(-Math.random()*7)+'s' }); w.appendChild(b); } })();

let AC=null;
function tone(f, dur, type='triangle', vol=.14, delay=0){
  if (!Shell.soundOn()) return;
  try{ AC ||= new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur); }catch(e){}
}
const sndFlip = () => tone(660, .07, 'sine', .1);
const sndMatch = () => [784,1047].forEach((f,i) => tone(f, .16, 'triangle', .16, i*.08));
const sndMiss = () => tone(220, .16, 'sine', .12);
const sndWin = () => [523,659,784,1047].forEach((f,i) => tone(f, i===3?.5:.14, 'triangle', .18, i*.09));

//// ===== the deck =====
const FACES = ['🍕','🐸','🎸','🚀','🌈','🍩','🦄','🎲','🐙','⚽','🌮','👾','🍓','🎈','🦊','🍿'];
function deal(){
  const f = FACES.slice().sort(()=>Math.random()-.5).slice(0,8);
  return f.concat(f).sort(()=>Math.random()-.5);
}
// mode 'solo' | 'online' (host is player 0 and deals; the first turn alternates each game)
const G = { mode:'solo', deck:[], up:[], done:new Set(), tries:0, pairs:[0,0], turn:0, starter:0, lock:false, over:false, room:null, me:0, wins:[0,0] };
const meIdx = () => G.me;
function playerName(i){
  if (G.mode==='solo') return 'You';
  const p = i===G.me ? G.room.me : G.room.other;
  return p ? `${p.avatar} ${p.name}` : 'Friend';
}
function render(){
  const d=$('deck'); d.innerHTML='';
  G.deck.forEach((face,i) => {
    const c=document.createElement('div'); c.className='mc'+(G.up.includes(i)?' up':'')+(G.done.has(i)?' done':'');
    c.innerHTML=`<div class="in"><div class="b"></div><div class="f"><span>${face}</span></div></div>`;
    c.onclick=()=>humanFlip(i);
    d.appendChild(c);
  });
  if (G.mode==='solo'){
    $('kA').textContent='Pairs'; $('sA').textContent=G.pairs[0];
    $('kB').textContent='Tries'; $('sB').textContent=G.tries;
    $('pA').classList.remove('turn'); $('pB').classList.remove('turn');
    $('status').textContent = G.over ? '' : 'Find the pairs';
  } else {
    $('kA').textContent=playerName(0); $('sA').textContent=G.pairs[0];
    $('kB').textContent=playerName(1); $('sB').textContent=G.pairs[1];
    $('pA').classList.toggle('turn', !G.over && G.turn===0); $('pB').classList.toggle('turn', !G.over && G.turn===1);
    $('status').innerHTML = G.over ? '' : G.turn===G.me ? 'Your turn' : `${esc(playerName(G.turn))}'s turn`;
  }
}
// one flip, applied the same way on both screens (online) so the boards stay in step
function flip(i){
  if (G.over || G.lock || G.up.includes(i) || G.done.has(i)) return false;
  G.up.push(i); sndFlip(); render();
  if (G.up.length<2) return true;
  const [a,b]=G.up; G.tries++;
  if (G.deck[a]===G.deck[b]){
    G.done.add(a); G.done.add(b); G.up=[]; G.pairs[G.turn]++; sndMatch();
    if (G.done.size===G.deck.length){ G.over=true; render(); finish(); } else render();
  } else {
    G.lock=true; sndMiss();
    setTimeout(() => { G.up=[]; G.lock=false; if (G.mode==='online') G.turn=1-G.turn; render(); }, 900);
  }
  return true;
}
function humanFlip(i){
  if (G.mode==='online' && G.turn!==G.me) return;
  if (flip(i) && G.mode==='online' && G.room) G.room.send({ t:'flip', i });
}
function newGame(deck){
  Object.assign(G, { deck, up:[], done:new Set(), tries:0, pairs:[0,0], lock:false, over:false });
  G.turn=G.starter; G.starter=1-G.starter;
  show('scGame'); render();
}
function finish(){
  sndWin();
  let em, title, sub, pts=0;
  if (G.mode==='solo'){
    pts = Math.max(5, 40 - 2*(G.tries-8));        // a perfect game (8 tries) is worth 40
    em='🧠'; title=`${pts} points`; sub=`All 8 pairs in ${G.tries} tries.`;
  } else {
    const mine=G.pairs[G.me], theirs=G.pairs[1-G.me];
    pts = mine + (mine>theirs ? 5 : 0);            // pairs, plus 5 for the win
    em = mine>theirs ? '🏆' : mine<theirs ? '😬' : '🤝';
    title = mine>theirs ? 'You win!' : mine<theirs ? `${esc(playerName(1-G.me))} wins` : "It's a tie";
    sub = `${mine} pairs to ${theirs}.`;
  }
  if (pts) Shell.postScore('memory', pts);
  setTimeout(() => Shell.results({ em, title, sub,
    again:{ label:'Play again', onClick:()=>{
      if (G.mode==='solo') return newGame(deal());
      if (G.room.isHost){ const d=deal(); G.room.send({ t:'again', deck:d }); newGame(d); }
      else { G.room.send({ t:'again-req' }); $('status').textContent='Waiting for the host to deal…'; }
    } },
    change:{ label:'Change mode', onClick:()=>{ leaveRoom(); openMode(); } } }), 900);
}

//// ===== the standard start sequence =====
function openMode(){
  Shell.mode({ options:[
      { label:'Play solo', onClick:()=>{ Shell.hide(); leaveRoom(); Object.assign(G,{ mode:'solo', me:0, starter:0 }); newGame(deal()); } },
      { label:'Play a friend', kind:'b', onClick:()=>Shell.friend(FRIEND) } ],
    onBack:()=>show('scIntro') });
}
const FRIEND = {
  game:'memory',
  onBack: openMode,
  startData: () => ({ deck: deal() }),                 // the host deals; both see the same cards
  onStart: (R, data) => { Object.assign(G, { mode:'online', room:R, me: R.isHost ? 0 : 1, starter:0 }); newGame(data.deck); },
  onMessage: m => {
    if (m.t==='flip'){ if (G.turn!==G.me) flip(m.i); }
    else if (m.t==='again' && G.over){ Shell.hide(); newGame(m.deck); }
    else if (m.t==='again-req' && G.over && G.room.isHost){ Shell.hide(); const d=deal(); G.room.send({ t:'again', deck:d }); newGame(d); }
  },
  onLeft: () => { if (!G.over) $('status').textContent='Your friend left'; },
};
function leaveRoom(){ if (G.room){ Shell.leaveRoom(); G.room=null; } }

$('introGo').onclick = () => Shell.requirePlayer().then(openMode);
Shell.addBack('#scIntro .card', () => Shell.nav('games'));
Shell.init({
  brand:'Memory',
  theme:{ key:'nysgpt-theme-f3', darkDefault:false },
  beforeLeave:()=>!G.room || confirm('Leave this game?'),
  onJoinLink: code => Shell.joinCode(FRIEND, code),
  playground:{ swatches:['#ffc93d','#ff7a3c','#1fb3a3','#8b5cf6','#ff4d8d','#37c871'].map(c=>({ bg:c, vars:{ '--bg':c } })) },
});
</script>
</body>
</html>
