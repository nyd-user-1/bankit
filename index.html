<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Playground</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<script>(function(){ try{ if(localStorage.getItem('nysgpt-theme-f3')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){} })();</script>
<style>
  /* ===== the app frame: every page runs in #view; the chat panel lives here, so it
     survives navigation between games without reloading or losing its state ===== */
  :root{
    --panel:#fffaf2; --panel-2:#fff0dd; --ink:#2a1a3e; --ink-dim:#7a6385; --ink-faint:#b6a6c0; --line:#f1dfc6;
    --accent:#8b5cf6; --accent-sh:#6d3fd6; --teal:#1fc7b6; --pink:#ff4d8d; --yellow:#ffd23f;
    --font-display:"Luckiest Guy",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif;
    --w:370px;
  }
  :root[data-theme="dark"]{ --panel:#2e1a44; --panel-2:#3a2356; --ink:#fdf3ff; --ink-dim:#c4a9d8; --ink-faint:#7c6190; --line:#46295f; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a1024}
  body{font-family:var(--font-body);font-weight:800;color:var(--ink)}
  button,input{font-family:inherit}
  button{cursor:pointer;border:none;background:none;color:inherit}

  /* ===== game invite: "Frogman wants to play Checkers" ===== */
  .invite{position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;display:none;place-items:center;background:rgba(20,10,30,.35);padding:20px;transition:width .32s cubic-bezier(.3,.9,.3,1)}
  body.open .invite{width:calc(100% - var(--w))}
  .invite.on{display:grid}
  .invite .c{background:var(--panel);border-radius:26px;box-shadow:0 10px 0 rgba(0,0,0,.25);padding:28px 30px;width:min(400px,100%);text-align:center;animation:invite .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes invite{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
  .invite .av{font-size:46px;line-height:1;margin-bottom:10px}
  .invite h2{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.15;margin-bottom:20px}
  .invite h2 b{font-weight:400;color:var(--accent)}
  .invite .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .invite button{font-family:var(--font-display);font-size:19px;border-radius:15px;padding:13px 10px;position:relative;top:0}
  .invite .yes{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-sh)}
  .invite .no{background:var(--panel-2);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.12)}
  .invite button:active{top:4px;box-shadow:none}
  #view{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:block;background:#ff7a3c;transition:width .32s cubic-bezier(.3,.9,.3,1)}
  body.open #view{width:calc(100% - var(--w))}

  /* the tab that peeks in from the right edge */
  .tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:var(--panel);color:var(--ink);border-radius:16px 0 0 16px;padding:14px 10px 14px 12px;box-shadow:-4px 5px 0 rgba(0,0,0,.18);
    transition:right .32s cubic-bezier(.3,.9,.3,1)}
  body.open .tab{right:var(--w)}
  .tab .ic{font-size:22px}
  .tab .n{min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px}
  .tab .n:empty{display:none}

  /* the panel */
  .panel{position:fixed;top:0;bottom:0;right:calc(-1 * var(--w));width:var(--w);z-index:31;background:var(--panel);display:flex;flex-direction:column;
    box-shadow:-6px 0 0 rgba(0,0,0,.12);transition:right .32s cubic-bezier(.3,.9,.3,1)}
  body.open .panel{right:0}
  .ph{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;border-bottom:2px solid var(--line)}
  .ph h2{font-family:var(--font-display);font-size:24px;font-weight:400;flex:1}
  .online{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim)}
  .online .avs{display:flex}
  .online .avs span{width:26px;height:26px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-size:15px;margin-left:-7px;border:2px solid var(--panel)}
  .online .avs span:first-child{margin-left:0}
  .x{width:34px;height:34px;border-radius:10px;background:var(--panel-2);font-size:18px;display:grid;place-items:center}
  .msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
  .m{display:flex;gap:9px;align-items:flex-end;max-width:92%}
  .m .av{font-size:22px;flex-shrink:0;width:30px;text-align:center}
  .m .bub{background:var(--panel-2);border-radius:16px 16px 16px 4px;padding:8px 12px;min-width:0}
  .m .who{font-size:11.5px;font-weight:900;color:var(--ink-dim);margin-bottom:2px;display:flex;gap:8px;align-items:baseline}
  .m .who time{font-weight:800;color:var(--ink-faint);font-size:10.5px}
  .m .tx{font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .m.me{align-self:flex-end;flex-direction:row-reverse}
  .m.me .bub{background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px}
  .m.me .who{color:rgba(255,255,255,.85)} .m.me .who time{color:rgba(255,255,255,.7)}
  .m.cont .av{visibility:hidden} .m.cont .who{display:none}
  .empty{margin:auto;text-align:center;color:var(--ink-faint);font-size:14px;padding:30px}
  .compose{display:flex;gap:8px;padding:12px 14px 16px;border-top:2px solid var(--line)}
  .compose input{flex:1;min-width:0;font-size:15px;font-weight:800;color:var(--ink);background:var(--panel-2);border:2.5px solid transparent;border-radius:14px;padding:11px 13px;outline:none}
  .compose input:focus{border-color:var(--teal)}
  .send{font-family:var(--font-display);font-size:16px;color:#fff;background:var(--accent);border-radius:14px;padding:0 16px;box-shadow:0 4px 0 var(--accent-sh);position:relative;top:0}
  .send:active{top:3px;box-shadow:0 1px 0 var(--accent-sh)}
  .gate{padding:18px 16px 20px;border-top:2px solid var(--line);text-align:center}
  .gate p{color:var(--ink-dim);font-size:14px;margin-bottom:12px}
  .gate button{font-family:var(--font-display);font-size:18px;color:#fff;background:var(--accent);border-radius:14px;padding:12px 22px;box-shadow:0 4px 0 var(--accent-sh)}
  .err{color:#e0245e;font-size:12.5px;text-align:center;min-height:0;padding:0 14px}
  .err:not(:empty){padding-bottom:6px}
  .conn{font-size:11.5px;color:var(--ink-faint);text-align:center;padding:6px}
  .conn:empty{display:none}
  @media(max-width:640px){
    :root{--w:100vw}
    body.open #view{width:100%}
    .tab{padding:10px 8px 10px 10px}
  }
</style>
</head>
<body>
<iframe id="view" title="Games" allow="microphone; clipboard-write"></iframe>

<button class="tab" id="tab" aria-label="Open chat" aria-expanded="false"><span class="ic">💬</span><span class="n" id="unread"></span></button>
<aside class="panel" id="panel" aria-label="Chat">
  <div class="ph">
    <h2>Chat</h2>
    <div class="online" id="online"></div>
    <button class="x" id="close" aria-label="Close chat">✕</button>
  </div>
  <div class="conn" id="conn"></div>
  <div class="msgs" id="msgs"></div>
  <div class="err" id="err"></div>
  <form class="compose" id="compose" style="display:none">
    <input id="text" maxlength="500" autocomplete="off" placeholder="Say something…" aria-label="Message" />
    <button class="send" type="submit">Send</button>
  </form>
  <div class="gate" id="gate" style="display:none">
    <p>Sign in to chat with everyone playing.</p>
    <button id="signIn" type="button">Sign in</button>
  </div>
</aside>
<div class="invite" id="invite"><div class="c"><div class="av" id="inviteAv"></div><h2 id="inviteT"></h2>
  <div class="row"><button class="yes" id="inviteYes" type="button">Join</button><button class="no" id="inviteNo" type="button">Not now</button></div></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const view = $('view');

//// ===== the page inside the frame (?p=), kept in the address bar as you move around =====
const SAFE = /^([a-z0-9-]+\.html([?#].*)?|api\/play\?.*)$/i;
const start = new URLSearchParams(location.search).get('p');
view.src = start && SAFE.test(start) ? start : 'games.html';
function syncUrl(){
  try{
    const w = view.contentWindow, path = w.location.pathname.replace(/^\//,'') + w.location.search + w.location.hash;
    const url = path === 'games.html' ? '/' : '/?p=' + encodeURIComponent(path);
    if (location.pathname + location.search !== url) history.replaceState(null, '', url);
    document.title = w.document.title || document.title;
  }catch(e){}
}
view.addEventListener('load', () => {
  syncUrl();
  try{ view.contentWindow.addEventListener('hashchange', syncUrl); }catch(e){}
  applyTheme();
});

//// ===== the room: a friend room that outlives any one game page =====
// Games borrow this connection (shell.js looks for top.Room), so two friends stay together as
// they move between games. Either one can pick the next game from the hub: the other gets an
// invite card here; Join loads the same game on both screens and it starts at once.
//   sh-invite {page,title} · sh-accept · sh-decline · sh-cancel · sh-here {page} · sh-away
window.Room = (() => {
  const cid = sessionStorage.getItem('sh-cid') || (() => { const c=Math.random().toString(36).slice(2,12); sessionStorage.setItem('sh-cid',c); return c; })();
  let ws=null, code=null, other=null, cbs=null, pending=null, here=null, inv=null;
  const local = /^(localhost|127\.|10\.|192\.168\.)/.test(location.hostname);
  const url = () => local ? (location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?cid='+cid
                          : 'wss://ymusg32gv4.execute-api.us-east-1.amazonaws.com/prod?ch=relay&cid='+cid;
  const send = m => { if (ws && ws.readyState===1) ws.send(JSON.stringify(m)); };
  const tell = (k, m) => { try{ if (cbs && cbs[k]) cbs[k](m); }catch(e){ cbs=null; } };   // the page may be gone
  function reset(){ ws=null; code=null; other=null; pending=null; here=null; closeInvite(); }
  function connect(first, callbacks){
    leave(); cbs=callbacks;
    const s = ws = new WebSocket(url());
    s.onopen = () => { s.send(JSON.stringify(first)); const t=setInterval(() => { if (s.readyState===1) s.send('{"t":"ping"}'); else clearInterval(t); }, 240000); };
    s.onerror = () => { if (ws===s) tell('onError'); };
    s.onclose = () => { if (ws!==s) return; reset(); tell('onClose'); };
    s.onmessage = e => { let m; try{ m=JSON.parse(e.data); }catch(_){ return; } route(m); };
  }
  function route(m){
    if (m.t==='created' || m.t==='joined') code=m.room;
    if (m.t==='sh-hi' && m.from!==cid && (!other || other.id===m.from)) other={ id:m.from, name:m.name||'Friend', avatar:m.avatar||'🎯' };
    if (m.t==='left' || m.t==='host-left'){ other=null; pending=null; closeInvite(); }
    if (m.t==='sh-invite') return openInvite(m);
    if (m.t==='sh-cancel'){ closeInvite(); return; }
    if (m.t==='sh-accept') return;
    if (m.t==='sh-here') here=m.page;
    if (m.t==='sh-decline') pending=null;
    tell('onMsg', m);
  }
  function leave(){ const s=ws; reset(); cbs=null; if (s){ try{ s.close(); }catch(e){} } }
  const go = page => { try{ view.contentWindow.location.replace(page); }catch(e){ view.src=page; } };
  function propose(page, title){
    pending={ page, leader:cid }; here=null;
    send({ t:'sh-invite', page, title });
    go(page);
  }
  function openInvite(m){
    inv=m; $('inviteAv').textContent = other ? other.avatar : '🎮';
    $('inviteT').innerHTML = `${esc(other ? other.name : 'Your friend')} wants to play <b>${esc(m.title||'a game')}</b>`;
    $('invite').classList.add('on');
  }
  function closeInvite(){ inv=null; $('invite').classList.remove('on'); }
  $('inviteYes').onclick = () => { if (!inv) return; const m=inv; closeInvite(); pending={ page:m.page, leader:m.from }; here=null; send({ t:'sh-accept', page:m.page }); go(m.page); };
  $('inviteNo').onclick = () => { if (!inv) return; closeInvite(); send({ t:'sh-decline' }); };
  return {
    cid, connect, send, leave, propose,
    active: () => !!(ws && ws.readyState===1 && other),
    info: () => ({ code, other }),
    attach: c => { cbs=c; }, detach: c => { if (cbs===c) cbs=null; },
    pendingFor: page => pending && pending.page===page ? pending : null,
    clearPending: () => { pending=null; },
    hereFor: page => here===page,
  };
})();

//// ===== theme + identity follow whatever the pages set =====
function applyTheme(){ if (localStorage.getItem('nysgpt-theme-f3')==='dark') document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); }
const me = () => { try{ const u=JSON.parse(localStorage.getItem('bankit-user-v1')||'null'); return u && u.name ? u : null; }catch(e){ return null; } };
window.addEventListener('storage', e => {
  if (e.key==='nysgpt-theme-f3') applyTheme();
  if (e.key==='bankit-user-v1'){ hello(); renderGate(); renderMsgs(); }
});

//// ===== open / close (pushes the page over; remembered for this tab) =====
function setOpen(on){
  document.body.classList.toggle('open', on);
  $('tab').setAttribute('aria-expanded', on ? 'true' : 'false');
  sessionStorage.setItem('bankit-chat-open', on ? '1' : '');
  if (on){ unread=0; renderUnread(); requestAnimationFrame(()=>{ scrollDown(); if ($('compose').style.display!=='none') $('text').focus(); }); }
}
$('tab').onclick = () => setOpen(!document.body.classList.contains('open'));
$('close').onclick = () => setOpen(false);
document.addEventListener('keydown', e => { if (e.key==='Escape' && document.body.classList.contains('open')) setOpen(false); });

//// ===== the chat =====
let ws=null, retry=0, MSGS=[], unread=0;
function connect(){
  // local dev: the dev server's /chat; anywhere else: the API Gateway WebSocket (aws/ws-handler.js)
  ws = new WebSocket(/^(localhost|127\.|10\.|192\.168\.)/.test(location.hostname)
    ? (location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/chat'
    : 'wss://ymusg32gv4.execute-api.us-east-1.amazonaws.com/prod?ch=chat');
  const sock = ws, ka = setInterval(() => { if (sock.readyState===1) sock.send('{"t":"ping"}'); else clearInterval(ka); }, 240000);
  ws.onopen = () => { retry=0; $('conn').textContent=''; ws.send('{"t":"hist"}'); hello(); };
  ws.onmessage = e => { let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if (m.t==='hist'){ MSGS=m.msgs||[]; renderMsgs(); }
    else if (m.t==='msg'){ MSGS.push(m.m); if (MSGS.length>200) MSGS.shift(); appendMsg(m.m);
      const mine = me() && m.m.name.toLowerCase()===me().name.toLowerCase();
      if (!document.body.classList.contains('open') && !mine && me()){ unread++; renderUnread(); } }
    else if (m.t==='presence') renderOnline(m.names||[]);
    else if (m.t==='error'){ $('err').textContent=m.error; setTimeout(()=>$('err').textContent='', 2500); }
  };
  ws.onclose = () => { $('conn').textContent='Reconnecting…'; setTimeout(connect, Math.min(8000, 800 * 2 ** retry++)); };
}
function hello(){ const p=me(); if (p && ws && ws.readyState===1) ws.send(JSON.stringify({ t:'hello', name:p.name, avatar:p.avatar })); }
function renderGate(){ const p=me(); $('compose').style.display = p ? '' : 'none'; $('gate').style.display = p ? 'none' : ''; }
$('signIn').onclick = () => { try{ const S=view.contentWindow.Shell; if (S) S.requirePlayer(); else view.src='games.html#/settings'; }catch(e){ view.src='games.html#/settings'; } };
const time = ts => new Date(ts).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
function msgHTML(m, prev){
  const p=me(), mine = p && m.name.toLowerCase()===p.name.toLowerCase();
  const cont = prev && prev.name===m.name && m.ts-prev.ts < 3*60*1000;
  return `<div class="m${mine?' me':''}${cont?' cont':''}"><span class="av">${esc(m.avatar)}</span><div class="bub">`+
    `<div class="who">${mine?'You':esc(m.name)}<time>${time(m.ts)}</time></div><div class="tx">${esc(m.text)}</div></div></div>`;
}
function renderMsgs(){
  const box=$('msgs');
  if (!me()){ box.innerHTML='<div class="empty">Chat is for signed-in players.</div>'; return; }
  box.innerHTML = MSGS.length ? MSGS.map((m,i)=>msgHTML(m, MSGS[i-1])).join('') : '<div class="empty">No messages yet — say hi.</div>';
  scrollDown();
}
function appendMsg(m){
  if (!me()) return;
  const box=$('msgs'), nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const e=box.querySelector('.empty'); if (e) e.remove();
  box.insertAdjacentHTML('beforeend', msgHTML(m, MSGS[MSGS.length-2]));
  if (nearBottom || (me() && m.name.toLowerCase()===me().name.toLowerCase())) scrollDown();
}
const scrollDown = () => { const b=$('msgs'); b.scrollTop=b.scrollHeight; };
function renderOnline(names){
  $('online').innerHTML = `<span class="avs">${names.slice(0,5).map(n=>`<span title="${esc(n.name)}">${esc(n.avatar)}</span>`).join('')}</span>${names.length} online`;
  $('online').title = names.map(n=>n.name).join(', ');
}
function renderUnread(){ $('unread').textContent = unread ? (unread>99?'99+':unread) : ''; }
$('compose').onsubmit = e => {
  e.preventDefault();
  const t=$('text').value.trim(); if (!t || !ws || ws.readyState!==1) return;
  ws.send(JSON.stringify({ t:'say', text:t })); $('text').value='';
};

applyTheme(); renderGate(); renderMsgs(); connect();
if (sessionStorage.getItem('bankit-chat-open')) setOpen(true);
</script>
</body>
</html>
