<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Checkers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<script>(function(){ try{ if(localStorage.getItem('nysgpt-theme-f3')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){} })();</script>
<link rel="stylesheet" href="shell.css" />
<style>
  /* Checkers's own stage */
  :root{
    --bg:#d64545; --panel:#fffaf2; --panel-2:#fde8e8; --ink:#2a1a3e; --ink-dim:#7a6385; --ink-faint:#b6a6c0; --shadow:#8f2323;
    --teal:#1fc7b6; --teal-sh:#13978a; --pink:#ff4d8d; --yellow:#ffd23f; --purple:#8b5cf6; --purple-sh:#6d3fd6;
    --p0:#2a1a3e; --p0-sh:#0f0818; --p1:#ffb020; --p1-sh:#c07f00;
    --font-display:"Luckiest Guy",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif; --pop:1;
    --sh-a:var(--p0); --sh-a-sh:var(--p0-sh); --sh-b:var(--p1); --sh-b-sh:var(--p1-sh);
  }
  :root[data-theme="dark"]{ --bg:#2e0d0d; --panel:#451818; --panel-2:#5a2222; --ink:#f6f1ff; --ink-dim:#bcaee3; --ink-faint:#7a6aa8; --shadow:#08051a; }
  :root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:800;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;background-attachment:fixed;
    background-image:radial-gradient(circle at 18% 16%, rgba(255,255,255,.10), transparent 42%),radial-gradient(circle at 84% 82%, rgba(255,255,255,.07), transparent 46%)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .bgfloat{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgfloat .b{position:absolute;border-radius:50%;opacity:.16;background:#fff;animation:bob 7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(6deg)}}
  .stage{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:92px 18px 40px}
  .screen{display:none;width:100%;max-width:520px}
  .screen.on{display:block}
  .card{background:var(--panel);border-radius:28px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);padding:34px 36px;width:100%;animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  @media(max-width:560px){.card{padding:28px 22px}}
  h1{font-family:var(--font-display);font-size:clamp(34px,7vw,50px);text-align:center;line-height:.98;margin-bottom:10px;font-weight:400}
  h1 .x{color:var(--p0)} h1 .o{color:var(--p1);display:inline-block;transform:rotate(-4deg)}
  .sub{text-align:center;color:var(--ink-dim);font-size:15px;margin-bottom:22px;line-height:1.5}
  .rules{background:var(--panel-2);border-radius:18px;padding:18px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:11px}
  .rule{display:flex;align-items:center;gap:13px;font-size:14.5px}
  .rule .n{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:var(--teal);color:#053d38;display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--teal-sh)}
  .rule:nth-child(2) .n{background:var(--pink);box-shadow:0 3px 0 #cc2f6e;color:#fff}
  .rule:nth-child(3) .n{background:var(--yellow);box-shadow:0 3px 0 #d9a800;color:#5a4500}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:#fff;background:var(--p0);
    padding:15px 26px;border-radius:16px;position:relative;top:0;box-shadow:0 calc(6px * var(--pop)) 0 var(--p0-sh);transition:top .08s,box-shadow .08s}
  .btn:active{top:5px;box-shadow:0 1px 0 var(--p0-sh)}

  .play{max-width:560px}
  .score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .score.three{grid-template-columns:1fr auto 1fr}
  .pill{background:var(--panel);border-radius:16px;box-shadow:0 calc(5px * var(--pop)) 0 var(--shadow);padding:10px 12px;text-align:center;transition:transform .15s,box-shadow .15s;min-width:0}
  .pill .k{font-family:var(--font-display);font-size:15px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill .v{font-family:var(--font-display);font-size:30px;line-height:1.1}
  .pill.p0 .k{color:var(--p0)} .pill.p1 .k{color:var(--p1)} .pill.pd .k{color:var(--ink-faint)}
  .pill.turn{transform:scale(1.07);box-shadow:0 5px 0 var(--shadow),0 0 0 4px var(--yellow)}
  .status{font-family:var(--font-display);font-size:24px;text-align:center;color:#fff;text-shadow:0 3px 0 var(--shadow);min-height:34px;margin-bottom:14px}
  .boardcard{background:var(--panel);border-radius:26px;padding:16px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  :root{--pc0:#2a1a3e;--pc0-sh:#0f0818;--pc1:#e8323c;--pc1-sh:#9e1c23}
  .pill .k{color:var(--ink)!important}
  .pill .k::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
  .pill.p0 .k::before{background:var(--pc0)} .pill.p1 .k::before{background:var(--pc1)}
  .cboard{display:grid;grid-template-columns:repeat(8,1fr);border-radius:16px;overflow:hidden;aspect-ratio:1;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
  .sq{aspect-ratio:1;display:grid;place-items:center;position:relative;background:#f4dfc4}
  .sq.dk{background:#b5714a} :root[data-theme="dark"] .sq{background:#6b4b37} :root[data-theme="dark"] .sq.dk{background:#3f2a1d}
  .sq.dest{cursor:pointer}
  .sq.dest::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 3px var(--yellow)}
  .sq.dest:hover::after{background:var(--yellow)}
  .sq.from{box-shadow:inset 0 0 0 4px rgba(255,210,63,.6)}
  .pc{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,3.6vw,24px);position:relative;transition:transform .12s}
  .pc.p0{background:var(--pc0);box-shadow:inset 0 -5px 0 var(--pc0-sh),0 3px 0 rgba(0,0,0,.25)}
  .pc.p1{background:var(--pc1);box-shadow:inset 0 -5px 0 var(--pc1-sh),0 3px 0 rgba(0,0,0,.25)}
  .pc.can{cursor:pointer} .pc.can:hover{transform:translateY(-3px)}
  .pc.must{box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 3px var(--yellow)}
  .pc.sel{transform:translateY(-4px) scale(1.06);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 0 0 4px #fff}
  .pc.ghost{opacity:.35}
</style>
</head>
<body>
<div class="bgfloat" id="bgfloat"></div>
<div class="stage">
  <section class="screen on" id="scIntro">
    <div class="card">
      <h1><span class="x">Check</span><span class="o">ers</span></h1>
      <div class="sub">Jump them all, or leave them nowhere to go.<br>Play the computer or a friend.</div>
      <div class="rules">
        <div class="rule"><span class="n">1</span><span>Move one piece a square forward on the diagonal.</span></div>
        <div class="rule"><span class="n">2</span><span>Jumps are a must — keep jumping while you can. Reach the far row to be crowned 👑.</span></div>
        <div class="rule"><span class="n">3</span><span>Take every piece, or leave the other side with no move, to win.</span></div>
      </div>
      <button class="btn" id="introGo">Let's play!</button>
    </div>
  </section>

  <section class="screen play" id="scGame">
    <div class="score">
      <div class="pill p0" id="pA"><div class="k" id="kA"></div><div class="v" id="sA">12</div></div>
      <div class="pill p1" id="pB"><div class="k" id="kB"></div><div class="v" id="sB">12</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="boardcard"><div class="cboard" id="cb"></div></div>
  </section>
</div>

<script src="shell.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Shell.esc;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }
(function bg(){ const w=$('bgfloat'); for (let i=0;i<9;i++){ const b=document.createElement('div'); b.className='b'; const s=40+Math.random()*80;
  Object.assign(b.style,{ width:s+'px', height:s+'px', left:Math.random()*100+'%', top:Math.random()*100+'%', animationDelay:(-Math.random()*7)+'s' }); w.appendChild(b); } })();

//// ===== sounds =====
let AC=null;
function tone(f, dur, type='triangle', vol=.16, delay=0){
  if (!Shell.soundOn()) return;
  try{ AC ||= new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur); }catch(e){}
}
const sndWin = () => [523,659,784,1047].forEach((f,i) => tone(f, i===3 ? .5 : .14, 'triangle', .18, i*.09));
const sndLose = () => [392,330,262].forEach((f,i) => tone(f, .22, 'sine', .15, i*.14));
const sndDraw = () => [392,330].forEach((f,i) => tone(f, .22, 'sine', .15, i*.14));
const plural = (n, w, ws=w+'s') => `${n} ${n===1 ? w : ws}`;

const sndMove = () => tone(392, .08, 'triangle', .14);
const sndJump = () => [523,659].forEach((f,i) => tone(f, .1, 'triangle', .15, i*.06));
const sndKing = () => [659,784,988].forEach((f,i) => tone(f, .14, 'triangle', .15, i*.08));

//// ===== the game: player 0 starts on rows 5–7 and moves up; player 1 on rows 0–2 moves down =====
const rc = i => [i>>3, i&7];
const dirs = pc => pc.k ? [[-1,-1],[-1,1],[1,-1],[1,1]] : pc.p ? [[1,-1],[1,1]] : [[-1,-1],[-1,1]];
const lastRow = p => p ? 7 : 0;
function jumps(b, sq, pc, path, caps, out){
  const [r,c]=rc(sq);
  for (const [dr,dc] of dirs(pc)){
    const lr=r+2*dr, lc=c+2*dc; if (lr<0||lr>7||lc<0||lc>7) continue;
    const mid=(r+dr)*8+c+dc, land=lr*8+lc;
    if (!b[mid] || b[mid].p===pc.p || caps.includes(mid) || b[land]) continue;
    const np=[...path,land], nc=[...caps,mid];
    if (!pc.k && lr===lastRow(pc.p)){ out.push({ path:np, caps:nc }); continue; }   // crowning ends the turn
    const before=out.length; jumps(b, land, pc, np, nc, out);
    if (out.length===before) out.push({ path:np, caps:nc });
  }
}
// every legal move for p; jumps are compulsory
function movesFor(b, p){
  const js=[], steps=[];
  for (let sq=0; sq<64; sq++){ const pc=b[sq]; if (!pc || pc.p!==p) continue;
    const copy=b.slice(); copy[sq]=null; const out=[]; jumps(copy, sq, pc, [], [], out);
    out.forEach(m => js.push({ from:sq, ...m }));
    if (!js.length){ const [r,c]=rc(sq); for (const [dr,dc] of dirs(pc)){ const R=r+dr, C=c+dc; if (R>=0&&R<8&&C>=0&&C<8 && !b[R*8+C]) steps.push({ from:sq, path:[R*8+C], caps:[] }); } }
  }
  return js.length ? js : steps;
}
function apply(b, m){
  b=b.slice(); const pc={ ...b[m.from] }; b[m.from]=null; m.caps.forEach(x => b[x]=null);
  const end=m.path[m.path.length-1]; if (rc(end)[0]===lastRow(pc.p)) pc.k=true; b[end]=pc; return b;
}
const count = (b, p) => b.filter(x => x && x.p===p).length;

//// ===== the computer: alpha-beta over material, kings and advancement =====
function evalB(b, me){
  let s=0; b.forEach((pc,i) => { if (!pc) return; const [r]=rc(i), adv = pc.p ? r : 7-r;
    const v = 100 + (pc.k ? 70 : adv*4) + (r>0&&r<7 && (i&7)>0 && (i&7)<7 ? 3 : 0); s += pc.p===me ? v : -v; });
  return s;
}
function search(b, p, me, depth, al, be){
  const ms=movesFor(b, p);
  if (!ms.length) return { v: p===me ? -1e5-depth : 1e5+depth };
  if (!depth) return { v: evalB(b, me) };
  let best={ v: p===me ? -1e9 : 1e9, m: ms[0] };
  for (const m of ms){
    const v=search(apply(b,m), 1-p, me, depth-1, al, be).v;
    if (p===me ? v>best.v : v<best.v) best={ v, m };
    if (p===me) al=Math.max(al,v); else be=Math.min(be,v);
    if (be<=al) break;
  }
  return best;
}
function cpuMove(){
  const ms=movesFor(G.b, 1);
  if (G.level==='easy' && Math.random()<.5) return ms[Math.floor(Math.random()*ms.length)];
  const depth = G.level==='easy' ? 1 : 5;
  let best=null, bv=-1e9;
  for (const m of ms.slice().sort(() => Math.random()-.5)){        // shuffled so equal moves vary
    const v=search(apply(G.b,m), 0, 1, depth, bv, 1e9).v;
    if (v>bv || !best){ bv=v; best=m; }
  }
  return best;
}

// mode: 'cpu' (you are player 0) or 'online' (host 0, guest 1)
const G = { mode:'cpu', level:'hard', b:[], turn:0, starter:0, over:false, busy:false, room:null, me:0, sel:null, taken:[], quiet:0 };
const nameOf = p => {
  if (G.mode==='cpu') return p===0 ? 'You' : 'Computer';
  const q = p===G.me ? G.room.me : G.room.other;
  return q ? `${q.avatar} ${q.name}` : (p ? 'Player 2' : 'Player 1');
};
function render(){
  const legal = !G.over && !G.busy && G.turn===G.me ? movesFor(G.b, G.me) : [];
  const must = legal.length && legal[0].caps.length;
  const cands = G.sel==null ? [] : legal.filter(m => m.from===G.sel && G.taken.every((s,k) => m.path[k]===s));
  const dests = new Set(cands.map(m => m.path[G.taken.length]).filter(x => x!=null));
  // mid-jump: show the piece where it has got to, and the jumped pieces faded
  let b=G.b, ghosts=new Set();
  if (G.taken.length){ b=G.b.slice(); const at=G.taken[G.taken.length-1]; b[at]=b[G.sel]; b[G.sel]=null; cands[0].caps.slice(0,G.taken.length).forEach(x => ghosts.add(x)); }
  const at = G.taken.length ? G.taken[G.taken.length-1] : G.sel;
  const order = [...Array(64).keys()]; if (G.me===1) order.reverse();   // your pieces at the bottom
  $('cb').innerHTML = order.map(i => { const [r,c]=rc(i), pc=b[i], dk=(r+c)%2===1;
    const canMove = legal.some(m => m.from===i) && !G.taken.length;
    const pcs = pc ? `<div class="pc p${pc.p}${canMove?' can':''}${canMove&&must?' must':''}${i===at&&G.sel!=null?' sel':''}${ghosts.has(i)?' ghost':''}">${pc.k?'👑':''}</div>` : '';
    return `<div class="sq${dk?' dk':''}${dests.has(i)?' dest':''}${i===G.sel&&G.taken.length?' from':''}" data-i="${i}">${pcs}</div>`; }).join('');
  $('kA').textContent=nameOf(0); $('kB').textContent=nameOf(1);
  $('sA').textContent=count(G.b,0); $('sB').textContent=count(G.b,1);
  $('pA').classList.toggle('turn', !G.over && G.turn===0); $('pB').classList.toggle('turn', !G.over && G.turn===1);
  $('status').innerHTML = G.over ? '' : G.turn===G.me ? (must ? 'You must jump' : 'Your move') : (G.mode==='cpu' ? 'Thinking…' : `${esc(nameOf(G.turn))}'s move`);
}
function tap(i){
  if (G.over || G.busy || G.turn!==G.me) return;
  const legal=movesFor(G.b, G.me);
  if (!G.taken.length && legal.some(m => m.from===i)){ G.sel=i; render(); return; }
  if (G.sel==null) return;
  const next = legal.filter(m => m.from===G.sel && G.taken.every((s,k) => m.path[k]===s) && m.path[G.taken.length]===i);
  if (!next.length) return;
  G.taken.push(i);
  const done = next.find(m => m.path.length===G.taken.length);
  if (done){ if (G.mode==='online' && G.room) G.room.send({ t:'mv', f:done.from, path:done.path }); commit(done); }
  else { sndJump(); render(); }
}
function commit(m){
  const wasK = G.b[m.from].k;
  G.b=apply(G.b, m); G.sel=null; G.taken=[];
  const end=m.path[m.path.length-1];
  (!wasK && G.b[end].k) ? sndKing() : m.caps.length ? sndJump() : sndMove();
  G.quiet = m.caps.length ? 0 : G.quiet+1;
  G.turn=1-G.turn;
  if (!movesFor(G.b, G.turn).length){ G.over=true; render(); return finish(1-G.turn); }
  if (G.quiet>=80){ G.over=true; render(); return finish(-1); }       // 40 moves each with no capture
  render();
  if (G.mode==='cpu' && G.turn===1) cpuTurn();
}
function cpuTurn(){ G.busy=true; render(); setTimeout(() => { const m=cpuMove(); G.busy=false; if (!G.over && m) commit(m); }, 450); }
function newGame(){
  const b=Array(64).fill(null);
  for (let i=0;i<64;i++){ const [r,c]=rc(i); if ((r+c)%2===1){ if (r<3) b[i]={ p:1, k:false }; else if (r>4) b[i]={ p:0, k:false }; } }
  Object.assign(G, { b, over:false, busy:false, sel:null, taken:[], quiet:0 });
  G.turn=G.starter; G.starter=1-G.starter;
  show('scGame'); render();
  if (G.mode==='cpu' && G.turn===1) cpuTurn();
}
function finish(w){
  const won = w===G.me;
  if (w<0) sndDraw(); else if (won) sndWin(); else sndLose();
  if (won) Shell.postScore('checkers', 1);
  setTimeout(() => Shell.results({
    em: w<0 ? '🤝' : won ? '🏆' : (G.mode==='cpu' ? '🤖' : '😬'),
    title: w<0 ? "It's a draw" : won ? 'You win!' : (G.mode==='cpu' ? 'The computer wins' : `${esc(nameOf(w))} wins`),
    sub: w<0 ? '40 moves each without a capture.' : `${plural(count(G.b,G.me),'piece')} left to ${count(G.b,1-G.me)}.`,
    again: { label:'Play again', onClick:()=>{ if (G.mode==='online' && G.room) G.room.send({ t:'again' }); newGame(); } },
    change: { label:'Change mode', onClick:()=>{ leaveRoom(); openMode(); } },
  }), 900);
}

//// ===== the standard start sequence =====
function openMode(){
  Shell.mode({ options:[
      { label:'Play the computer', onClick:pickLevel },
      { label:'Play a friend', kind:'b', onClick:()=>Shell.friend(FRIEND) } ],
    onBack:()=>show('scIntro') });
}
function pickLevel(){
  Shell.mode({ title:'How tough?', options:[
      { label:'Easy', onClick:()=>startCpu('easy') },
      { label:'Hard', kind:'b', onClick:()=>startCpu('hard') } ],
    onBack:openMode });
}
function startCpu(level){ Shell.hide(); leaveRoom(); Object.assign(G, { mode:'cpu', level, me:0, starter:0 }); newGame(); }
const FRIEND = {
  game:'checkers',
  onBack: openMode,
  onStart: R => { Object.assign(G, { mode:'online', room:R, me: R.isHost ? 0 : 1, starter:0 }); newGame(); },
  onMessage: m => {
    if (m.t==='mv'){ if (G.over || G.turn===G.me) return;
      const mv=movesFor(G.b, G.turn).find(x => x.from===m.f && x.path.join()===m.path.join()); if (mv) commit(mv); }
    else if (m.t==='again' && G.over){ Shell.hide(); newGame(); }
  },
  onLeft: () => { if (!G.over) $('status').textContent = 'Your friend left'; },
};
function leaveRoom(){ if (G.room){ Shell.leaveRoom(); G.room=null; } }

$('cb').addEventListener('click', e => { const s=e.target.closest('[data-i]'); if (s) tap(+s.dataset.i); });
$('introGo').onclick = () => Shell.requirePlayer().then(openMode);
Shell.addBack('#scIntro .card', () => Shell.nav('games'));
Shell.init({
  brand:'Checkers',
  theme:{ key:'nysgpt-theme-f3', darkDefault:false },
  beforeLeave:()=>!G.room || confirm('Leave this game?'),
  onJoinLink: code => Shell.joinCode(FRIEND, code),
  playground:{ swatches:['#d64545','#37c871','#1fc7b6','#8b5cf6','#2d6fd6','#ff7a3c'].map(c=>({ bg:c, vars:{ '--bg':c } })) },
});
</script>
</body>
</html>
