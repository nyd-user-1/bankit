<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dots &amp; Boxes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
<script>(function(){ try{ if(localStorage.getItem('nysgpt-theme-f3')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){} })();</script>
<link rel="stylesheet" href="shell.css" />
<style>
  /* Dots &amp; Boxes's own stage */
  :root{
    --bg:#37c871; --panel:#fffaf2; --panel-2:#e6f8ec; --ink:#2a1a3e; --ink-dim:#7a6385; --ink-faint:#b6a6c0; --shadow:#1f8a4a;
    --teal:#1fc7b6; --teal-sh:#13978a; --pink:#ff4d8d; --yellow:#ffd23f; --purple:#8b5cf6; --purple-sh:#6d3fd6;
    --p0:#ff4d8d; --p0-sh:#cc2f6e; --p1:#2d6fd6; --p1-sh:#1b449a;
    --font-display:"Luckiest Guy",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif; --pop:1;
    --sh-a:var(--p0); --sh-a-sh:var(--p0-sh); --sh-b:var(--p1); --sh-b-sh:var(--p1-sh);
  }
  :root[data-theme="dark"]{ --bg:#0d2a1a; --panel:#163d27; --panel-2:#1f4f34; --ink:#f6f1ff; --ink-dim:#bcaee3; --ink-faint:#7a6aa8; --shadow:#08051a; }
  :root{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:800;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;background-attachment:fixed;
    background-image:radial-gradient(circle at 18% 16%, rgba(255,255,255,.10), transparent 42%),radial-gradient(circle at 84% 82%, rgba(255,255,255,.07), transparent 46%)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .bgfloat{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bgfloat .b{position:absolute;border-radius:50%;opacity:.16;background:#fff;animation:bob 7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-26px) rotate(6deg)}}
  .stage{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:92px 18px 40px}
  .screen{display:none;width:100%;max-width:520px}
  .screen.on{display:block}
  .card{background:var(--panel);border-radius:28px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);padding:34px 36px;width:100%;animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
  @media(max-width:560px){.card{padding:28px 22px}}
  h1{font-family:var(--font-display);font-size:clamp(34px,7vw,50px);text-align:center;line-height:.98;margin-bottom:10px;font-weight:400}
  h1 .x{color:var(--p0)} h1 .o{color:var(--p1);display:inline-block;transform:rotate(-4deg)}
  .sub{text-align:center;color:var(--ink-dim);font-size:15px;margin-bottom:22px;line-height:1.5}
  .rules{background:var(--panel-2);border-radius:18px;padding:18px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:11px}
  .rule{display:flex;align-items:center;gap:13px;font-size:14.5px}
  .rule .n{width:30px;height:30px;flex-shrink:0;border-radius:9px;background:var(--teal);color:#053d38;display:grid;place-items:center;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--teal-sh)}
  .rule:nth-child(2) .n{background:var(--pink);box-shadow:0 3px 0 #cc2f6e;color:#fff}
  .rule:nth-child(3) .n{background:var(--yellow);box-shadow:0 3px 0 #d9a800;color:#5a4500}
  .btn{display:flex;align-items:center;justify-content:center;width:100%;font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:#fff;background:var(--p0);
    padding:15px 26px;border-radius:16px;position:relative;top:0;box-shadow:0 calc(6px * var(--pop)) 0 var(--p0-sh);transition:top .08s,box-shadow .08s}
  .btn:active{top:5px;box-shadow:0 1px 0 var(--p0-sh)}

  .play{max-width:500px}
  .score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .score.three{grid-template-columns:1fr auto 1fr}
  .pill{background:var(--panel);border-radius:16px;box-shadow:0 calc(5px * var(--pop)) 0 var(--shadow);padding:10px 12px;text-align:center;transition:transform .15s,box-shadow .15s;min-width:0}
  .pill .k{font-family:var(--font-display);font-size:15px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill .v{font-family:var(--font-display);font-size:30px;line-height:1.1}
  .pill.p0 .k{color:var(--p0)} .pill.p1 .k{color:var(--p1)} .pill.pd .k{color:var(--ink-faint)}
  .pill.turn{transform:scale(1.07);box-shadow:0 5px 0 var(--shadow),0 0 0 4px var(--yellow)}
  .status{font-family:var(--font-display);font-size:24px;text-align:center;color:#fff;text-shadow:0 3px 0 var(--shadow);min-height:34px;margin-bottom:14px}
  .boardcard{background:var(--panel);border-radius:26px;padding:16px;box-shadow:0 calc(11px * var(--pop)) 0 var(--shadow);animation:pop .42s cubic-bezier(.2,1.4,.4,1) both}
  .dgrid{display:grid;aspect-ratio:1;width:100%;--d:16px;grid-template-columns:var(--d) repeat(4,1fr var(--d));grid-template-rows:var(--d) repeat(4,1fr var(--d));user-select:none}
  .dot{background:var(--ink);border-radius:50%;margin:3px}
  .ln{position:relative;border-radius:8px}
  .ln::after{content:"";position:absolute;border-radius:6px;background:var(--panel-2);transition:background .12s}
  .ln.h::after{left:0;right:0;top:50%;height:8px;margin-top:-4px}
  .ln.v::after{top:0;bottom:0;left:50%;width:8px;margin-left:-4px}
  .ln.open{cursor:pointer}
  .ln.open:hover::after{background:var(--ink-faint)}
  .ln.o0::after{background:var(--p0)} .ln.o1::after{background:var(--p1)}
  .ln.last::after{box-shadow:0 0 0 3px var(--yellow)}
  .bx{display:grid;place-items:center;border-radius:8px;margin:4px;font-size:clamp(22px,6vw,34px);transition:background .2s}
  .bx.o0{background:color-mix(in srgb, var(--p0) 26%, transparent)} .bx.o1{background:color-mix(in srgb, var(--p1) 26%, transparent)}
  .bx span{animation:drop .32s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes drop{from{transform:scale(.3) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="bgfloat" id="bgfloat"></div>
<div class="stage">
  <section class="screen on" id="scIntro">
    <div class="card">
      <h1><span class="x">Dots &amp;</span> <span class="o">Boxes</span></h1>
      <div class="sub">Close a box, claim it, go again.<br>Play the computer or a friend.</div>
      <div class="rules">
        <div class="rule"><span class="n">1</span><span>Take turns drawing one line between two dots.</span></div>
        <div class="rule"><span class="n">2</span><span>Draw the fourth side of a box to claim it — and go again.</span></div>
        <div class="rule"><span class="n">3</span><span>When every box is taken, the most boxes wins.</span></div>
      </div>
      <button class="btn" id="introGo">Let's play!</button>
    </div>
  </section>

  <section class="screen play" id="scGame">
    <div class="score">
      <div class="pill p0" id="pA"><div class="k" id="kA"></div><div class="v" id="sA">0</div></div>
      <div class="pill p1" id="pB"><div class="k" id="kB"></div><div class="v" id="sB">0</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="boardcard"><div class="dgrid" id="grid"></div></div>
  </section>
</div>

<script src="shell.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = Shell.esc;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); }
(function bg(){ const w=$('bgfloat'); for (let i=0;i<9;i++){ const b=document.createElement('div'); b.className='b'; const s=40+Math.random()*80;
  Object.assign(b.style,{ width:s+'px', height:s+'px', left:Math.random()*100+'%', top:Math.random()*100+'%', animationDelay:(-Math.random()*7)+'s' }); w.appendChild(b); } })();

//// ===== sounds =====
let AC=null;
function tone(f, dur, type='triangle', vol=.16, delay=0){
  if (!Shell.soundOn()) return;
  try{ AC ||= new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur); }catch(e){}
}
const sndWin = () => [523,659,784,1047].forEach((f,i) => tone(f, i===3 ? .5 : .14, 'triangle', .18, i*.09));
const sndLose = () => [392,330,262].forEach((f,i) => tone(f, .22, 'sine', .15, i*.14));
const sndDraw = () => [392,330].forEach((f,i) => tone(f, .22, 'sine', .15, i*.14));
const plural = (n, w, ws=w+'s') => `${n} ${n===1 ? w : ws}`;

const sndLine = p => tone(p ? 587 : 494, .09, 'triangle', .14);
const sndBox = () => [784,1047].forEach((f,i) => tone(f, .14, 'triangle', .16, i*.07));

//// ===== the game: a 4×4 box board; lines h-r-c (r 0..4, c 0..3) and v-r-c (r 0..3, c 0..4) =====
const N = 4;
const LINES = [];
for (let r=0;r<=N;r++) for (let c=0;c<N;c++) LINES.push(`h-${r}-${c}`);
for (let r=0;r<N;r++) for (let c=0;c<=N;c++) LINES.push(`v-${r}-${c}`);
const sidesOf = (r,c) => [`h-${r}-${c}`,`h-${r+1}-${c}`,`v-${r}-${c}`,`v-${r}-${c+1}`];
function boxesOf(k){                                  // the one or two boxes a line borders
  const [t,r,c]=k.split('-'), R=+r, C=+c, out=[];
  if (t==='h'){ if (R>0) out.push([R-1,C]); if (R<N) out.push([R,C]); }
  else { if (C>0) out.push([R,C-1]); if (C<N) out.push([R,C]); }
  return out;
}
// mode: 'cpu' (you are player 0) or 'online' (host 0, guest 1)
const G = { mode:'cpu', level:'hard', lines:{}, boxes:{}, pts:[0,0], turn:0, starter:0, over:false, busy:false, wins:[0,0,0], room:null, me:0, last:null };
const count = (lines, r, c) => sidesOf(r,c).filter(k => k in lines).length;
function apply(lines, k){                             // → boxes this line closes
  lines[k]=1; return boxesOf(k).filter(([r,c]) => count(lines,r,c)===4);
}

//// ===== the computer: take free boxes, avoid handing any over, else give away the fewest =====
function gifts(lines, k){                             // boxes the opponent could then chain-take
  const L={...lines}; apply(L,k); let n=0, again=true;
  while (again){ again=false;
    for (const m of LINES){ if (m in L) continue; const got=apply({...L},m).length; if (got){ apply(L,m); n+=got; again=true; } } }
  return n;
}
function cpuMove(){
  const open = LINES.filter(k => !(k in G.lines));
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const closing = open.filter(k => boxesOf(k).some(([r,c]) => count(G.lines,r,c)===3));
  if (closing.length && (G.level==='hard' || Math.random()<.6)) return rnd(closing);
  const safe = open.filter(k => boxesOf(k).every(([r,c]) => count(G.lines,r,c)<2));
  if (G.level==='easy') return rnd(Math.random()<.5 && safe.length ? safe : open);
  if (safe.length) return rnd(safe);
  let best=null, bestN=99;
  for (const k of open){ const n=gifts(G.lines,k); if (n<bestN){ bestN=n; best=k; } }
  return best;
}

const nameOf = p => {
  if (G.mode==='cpu') return p===0 ? 'You' : 'Computer';
  const R=G.room, q = p===G.me ? R.me : R.other;
  return q ? `${q.avatar} ${q.name}` : (p ? 'Player 2' : 'Player 1');
};
function render(){
  const el=$('grid'); el.innerHTML='';
  for (let gr=0; gr<=2*N; gr++) for (let gc=0; gc<=2*N; gc++){
    const d=document.createElement(gr%2 || gc%2 ? 'button' : 'div');
    if (gr%2===0 && gc%2===0) d.className='dot';
    else if (gr%2===1 && gc%2===1){ const r=(gr-1)/2, c=(gc-1)/2, o=G.boxes[`${r}-${c}`];
      d.className='bx'+(o!=null?' o'+o:''); if (o!=null) d.innerHTML=`<span>${G.mode==='cpu' ? (o?'🤖':'⭐') : esc(o===G.me ? G.room.me.avatar : (G.room.other||{avatar:'•'}).avatar)}</span>`; }
    else {
      const k = gr%2===0 ? `h-${gr/2}-${(gc-1)/2}` : `v-${(gr-1)/2}-${gc/2}`, o=G.lines[k];
      d.className='ln '+(gr%2===0?'h':'v')+(o!=null ? ' o'+o : ' open')+(k===G.last?' last':'');
      d.setAttribute('aria-label','line'); d.onclick=()=>humanMove(k);
    }
    el.appendChild(d);
  }
  $('kA').textContent=nameOf(0); $('kB').textContent=nameOf(1);
  $('sA').textContent=G.pts[0]; $('sB').textContent=G.pts[1];
  $('pA').classList.toggle('turn', !G.over && G.turn===0); $('pB').classList.toggle('turn', !G.over && G.turn===1);
  $('status').innerHTML = G.over ? '' : G.turn===G.me ? 'Your move' : (G.mode==='cpu' ? 'Thinking…' : `${esc(nameOf(G.turn))}'s move`);
}
function play(k){
  if (G.over || k in G.lines) return false;
  G.lines[k]=G.turn; G.last=k;
  const closed = boxesOf(k).filter(([r,c]) => count(G.lines,r,c)===4);
  closed.forEach(([r,c]) => { G.boxes[`${r}-${c}`]=G.turn; G.pts[G.turn]++; });
  if (closed.length) sndBox(); else { sndLine(G.turn); G.turn=1-G.turn; }
  if (G.pts[0]+G.pts[1]===N*N){ G.over=true; render(); finish(); return true; }
  render();
  if (G.mode==='cpu' && G.turn===1) cpuTurn();
  return true;
}
function humanMove(k){
  if (G.busy || G.over || G.turn!==G.me || k in G.lines) return;
  if (G.mode==='online' && G.room) G.room.send({ t:'line', k });
  play(k);
}
function cpuTurn(){ G.busy=true; setTimeout(() => { G.busy=false; if (!G.over) play(cpuMove()); }, 520); }
function newGame(){
  Object.assign(G, { lines:{}, boxes:{}, pts:[0,0], over:false, busy:false, last:null });
  G.turn=G.starter; G.starter=1-G.starter;            // alternate who opens
  show('scGame'); render();
  if (G.mode==='cpu' && G.turn===1) cpuTurn();
}
function finish(){
  const [a,b]=G.pts, w = a===b ? -1 : a>b ? 0 : 1, won = w===G.me;
  G.wins[w<0 ? 2 : w]++;
  if (w<0) sndDraw(); else if (won) sndWin(); else sndLose();
  if (won) Shell.postScore('dots', 1);
  setTimeout(() => Shell.results({
    em: w<0 ? '🤝' : won ? '🏆' : (G.mode==='cpu' ? '🤖' : '😬'),
    title: w<0 ? "It's a draw" : won ? 'You win!' : (G.mode==='cpu' ? 'The computer wins' : `${esc(nameOf(w))} wins`),
    sub: `${plural(G.pts[G.me],'box','boxes')} to ${G.pts[1-G.me]}.`,
    again: { label:'Play again', onClick:()=>{ if (G.mode==='online' && G.room) G.room.send({ t:'again' }); newGame(); } },
    change: { label:'Change mode', onClick:()=>{ leaveRoom(); openMode(); } },
  }), 900);
}

//// ===== the standard start sequence: intro → mode → (friend: host/join → lobby) =====
function openMode(){
  Shell.mode({ options:[
      { label:'Play the computer', onClick:pickLevel },
      { label:'Play a friend', kind:'b', onClick:()=>Shell.friend(FRIEND) } ],
    onBack:()=>show('scIntro') });
}
function pickLevel(){
  Shell.mode({ title:'How tough?', options:[
      { label:'Easy', onClick:()=>startCpu('easy') },
      { label:'Hard', kind:'b', onClick:()=>startCpu('hard') } ],
    onBack:openMode });
}
function startCpu(level){
  Shell.hide(); leaveRoom();
  Object.assign(G, { mode:'cpu', level, me:0, wins:[0,0,0], starter:0 }); newGame();
}
const FRIEND = {
  game:'dots',
  onBack: openMode,
  onStart: R => { Object.assign(G, { mode:'online', room:R, me: R.isHost ? 0 : 1, wins:[0,0,0], starter:0 }); newGame(); },
  onMessage: m => {
    if (m.t==='line'){ if (!G.over && G.turn!==G.me) play(m.k); }
    else if (m.t==='again' && G.over){ Shell.hide(); newGame(); }
  },
  onLeft: () => { if (!G.over) $('status').textContent = 'Your friend left'; },
};
function leaveRoom(){ if (G.room){ Shell.leaveRoom(); G.room=null; } }

$('introGo').onclick = () => Shell.requirePlayer().then(openMode);
Shell.addBack('#scIntro .card', () => Shell.nav('games'));
Shell.init({
  brand:'Dots&nbsp;&amp;&nbsp;Boxes',
  theme:{ key:'nysgpt-theme-f3', darkDefault:false },
  beforeLeave:()=>!G.room || confirm('Leave this game?'),
  onJoinLink: code => Shell.joinCode(FRIEND, code),
  playground:{ swatches:['#37c871','#ff7a3c','#1fc7b6','#8b5cf6','#2d6fd6','#ff4d8d'].map(c=>({ bg:c, vars:{ '--bg':c } })) },
});
</script>
</body>
</html>
